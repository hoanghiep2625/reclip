name: Build & Deploy reclip

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/reclip:latest
            ghcr.io/${{ github.repository_owner }}/reclip:${{ github.sha }}
          build-args: |
            BUILD_MODE=ssr  # hoặc static tùy bạn chọn

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /srv/tools/reclip
            # update image tag sang commit SHA mới để rollback dễ hơn
            sed -i "s#ghcr.io/.*/reclip:.*#ghcr.io/${{ github.repository_owner }}/reclip:${{ github.sha }}#g" docker-compose.yml

            docker compose pull
            docker compose up -d
            docker image prune -f
